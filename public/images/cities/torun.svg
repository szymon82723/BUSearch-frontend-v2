<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tor-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="tor-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="tor-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="tor-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#tor-bg)" />

  <!-- Subtle Inner Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <g filter="url(#tor-shadow)">
    <!-- Angel Wings (Anioł Toruński) -->
    <path d="M18 17 C 22 11, 30 13, 32 18 C 34 13, 42 11, 46 17 C 40 21, 35 24, 32 25 C 29 24, 24 21, 18 17 Z" fill="url(#tor-gold)" opacity="0.9" />
    <!-- Angel Halo & Head -->
    <circle cx="32" cy="11.5" r="4.5" fill="none" stroke="url(#tor-gold)" stroke-width="1.5" />
    <circle cx="32" cy="11.5" r="3" fill="#ffffff" />
    <!-- Angel Robe -->
    <path d="M28 17 h8 l2 8 h-12 z" fill="#ffffff" opacity="0.95" />

    <!-- Gothic Fortress Wall -->
    <path d="M12 36 h40 v18 h-40 z" fill="url(#tor-wall)" />
    <!-- Wall Crenellations -->
    <path d="M12 33 h5 v3 h-5 z M21 33 h5 v3 h-5 z M38 33 h5 v3 h-5 z M47 33 h5 v3 h-5 z" fill="url(#tor-wall)" />

    <!-- Left Tower -->
    <path d="M14 26 h8 v10 h-8 z" fill="url(#tor-wall)" />
    <path d="M14 26 l4 -8 l4 8 z" fill="#1e293b" />
    <circle cx="18" cy="17.5" r="1.5" fill="url(#tor-gold)" />

    <!-- Center Tower -->
    <path d="M27 24 h10 v12 h-10 z" fill="url(#tor-wall)" />
    <path d="M27 24 l5 -9 l5 9 z" fill="#1e293b" />
    <circle cx="32" cy="14.5" r="1.5" fill="url(#tor-gold)" />

    <!-- Right Tower -->
    <path d="M42 26 h8 v10 h-8 z" fill="url(#tor-wall)" />
    <path d="M42 26 l4 -8 l4 8 z" fill="#1e293b" />
    <circle cx="46" cy="17.5" r="1.5" fill="url(#tor-gold)" />

    <!-- Open Gate Arch -->
    <path d="M26 54 v-11 a6 6 0 0 1 12 0 v11 z" fill="#0f172a" />
    <path d="M28 43 h8 M28 46 h8 M30 43 v7 M34 43 v7" stroke="url(#tor-gold)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Golden Key of Toruń (Klucz Toruński) -->
    <g transform="translate(32, 38) rotate(-35) translate(-32, -38)">
      <circle cx="28" cy="38" r="3.5" fill="none" stroke="url(#tor-gold)" stroke-width="1.6" />
      <path d="M31.5 38 h11 M40 38 v2.5 M42.5 38 v2" stroke="url(#tor-gold)" stroke-width="1.6" stroke-linecap="round" />
    </g>
  </g>
</svg>
