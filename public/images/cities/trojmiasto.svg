<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="troj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="troj-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="troj-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="troj-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#082f49" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#troj-bg)" />

  <!-- Subtle Inner Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Tri-City Maritime Shield Base -->
  <g filter="url(#troj-shadow)">
    <!-- Elegant Spanish Shield Badge for the Gdańsk Heraldic Centre -->
    <path d="M21 10 h22 v18 c0 10 -11 16 -11 16 c0 0 -11 -6 -11 -16 z" fill="url(#troj-red)" />
    <path d="M21 10 h22 v18 c0 10 -11 16 -11 16 c0 0 -11 -6 -11 -16 z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

    <!-- Royal Golden Crown of Gdańsk -->
    <path d="M24 21 h16 l2 -7 l-5 3 l-5 -6 l-5 6 l-5 -3 z" fill="url(#troj-gold)" />
    <!-- Crown Jewels / Dots -->
    <circle cx="27" cy="14" r="1" fill="#fff" />
    <circle cx="32" cy="11.5" r="1.2" fill="#fff" />
    <circle cx="37" cy="14" r="1" fill="#fff" />

    <!-- Upper Cross Patée -->
    <g transform="translate(32, 27)">
      <path d="M-2 -5 h4 l1 3 h-2 v2 h2 l-1 3 h-4 l-1 -3 h2 v-2 h-2 z" fill="#ffffff" />
      <polygon points="-1,-4 1,-4 2,-1 4,-1 4,1 2,1 1,4 -1,4 -2,1 -4,1 -4,-1 -2,-1" fill="#ffffff" />
    </g>

    <!-- Lower Cross Patée -->
    <g transform="translate(32, 36)">
      <polygon points="-1,-4 1,-4 2,-1 4,-1 4,1 2,1 1,4 -1,4 -2,1 -4,1 -4,-1 -2,-1" fill="#ffffff" />
    </g>
  </g>

  <!-- Maritime Baltic Waves (Gdynia & Sopot Seagulls / Sails motif) -->
  <path d="M8 51 Q 20 46, 32 50 T 56 49" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M12 56 Q 22 52, 32 55 T 52 54" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />

  <!-- Subtle Seagull Silhouette -->
  <path d="M44 14 Q 47 11, 50 14 Q 53 11, 56 14" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />
</svg>
